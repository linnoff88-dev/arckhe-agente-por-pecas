<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat com o meu agente</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #0c0c10; color: #eee; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; }
  #conversa p { padding: 8px 12px; border-radius: 10px; margin: 8px 0; }
  .eu { background: #FACC15; color: #0c0c10; margin-left: 20%; }
  .agente { background: #1d1d24; margin-right: 20%; }
  .trilha { font: 13px/1.4 monospace; color: #9a9aa5; white-space: pre-wrap; margin: 0 0 12px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; border: 0; }
  button { padding: 10px 16px; font-size: 16px; border-radius: 8px; border: 0; background: #FACC15; }
</style>
</head>
<body>
<main>
  <h1>Chat com o meu agente</h1>
  <div id="conversa"></div>
  <form id="f"><input id="texto" autocomplete="off" placeholder="Escreva um pedido"><button>Enviar</button></form>
</main>
<script>
const conversa = document.getElementById("conversa");
function linha(classe, texto) {
  const p = document.createElement("p"); p.className = classe; p.textContent = texto; conversa.append(p);
}
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const campo = document.getElementById("texto"), texto = campo.value.trim();
  if (!texto) return;
  linha("eu", texto); campo.value = "";
  const r = await fetch("/", { method: "POST", body: JSON.stringify({ texto }) });
  const d = await r.json();
  linha("agente", d.resposta);
  linha("trilha", d.trilha.join("\n"));
};
</script>
</body>
</html>
